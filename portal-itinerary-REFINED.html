<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Trip | Passports & Postcards</title>

<style>
*{box-sizing:border-box}

:root{
  --navy:#18324a;
  --blue:#2f6f89;
  --light:#f4f7f8;
  --border:#dfe6e9;
  --text:#263238;
  --muted:#68777d;
  --white:#fff;
  --green:#2f7d61;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--text);
  line-height:1.5;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    linear-gradient(
      135deg,
      #18324a,
      #2f6f89
    );
}

.login-card{
  width:100%;
  max-width:440px;
  background:white;
  border-radius:18px;
  padding:38px;
  box-shadow:
    0 18px 50px rgba(0,0,0,.18);
}

.brand{
  text-align:center;
  margin-bottom:28px;
}

.brand h1{
  margin:0;
  color:var(--navy);
  font-size:28px;
}

.brand p{
  margin:7px 0 0;
  color:var(--muted);
}

label{
  display:block;
  font-weight:700;
  margin-bottom:6px;
}

input{
  width:100%;
  border:1px solid #cfd9dd;
  border-radius:9px;
  padding:12px;
  margin-bottom:18px;
}

.primary{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  background:var(--blue);
  color:white;
  font-weight:700;
}

.login-card .primary{
  width:100%;
}

.message{
  margin-top:16px;
  padding:11px 13px;
  border-radius:8px;
  background:#f8e4e4;
  color:#8a2f2f;
}

.portal-header{
  background:var(--navy);
  color:white;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:20px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.header-brand{
  font-size:21px;
  font-weight:700;
}

.header-brand span{
  display:block;
  font-size:13px;
  font-weight:400;
  opacity:.8;
}

.logout{
  background:transparent;
  border:1px solid rgba(255,255,255,.55);
  color:white;
  border-radius:8px;
  padding:8px 14px;
}

.hero{
  background:white;
  border-bottom:1px solid var(--border);
}

.hero-inner{
  max-width:1200px;
  margin:auto;
  padding:32px 24px;
}

.welcome{
  color:var(--blue);
  font-weight:700;
  margin-bottom:5px;
}

.hero h1{
  margin:0;
  color:var(--navy);
  font-size:34px;
}

.trip-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px 24px;
  margin-top:12px;
  color:var(--muted);
}

.portal-nav{
  background:white;
  border-bottom:1px solid var(--border);
  overflow:auto;
}

.nav-inner{
  max-width:1200px;
  margin:auto;
  padding:0 24px;
  display:flex;
  min-width:max-content;
}

.nav-btn{
  border:0;
  background:white;
  padding:16px 18px;
  color:#526269;
  font-weight:700;
  border-bottom:3px solid transparent;
}

.nav-btn.active{
  color:var(--blue);
  border-bottom-color:var(--blue);
}

main{
  max-width:1200px;
  margin:auto;
  padding:28px 24px 50px;
}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:18px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  padding:22px;
  box-shadow:
    0 2px 7px rgba(0,0,0,.035);
}

.card h2,
.card h3,
.card h4{
  margin-top:0;
  color:var(--navy);
}

.card h2{
  font-size:21px;
}

.summary-number{
  font-size:28px;
  font-weight:700;
  color:var(--navy);
}

.muted{
  color:var(--muted);
}

.section-title{
  margin:0 0 18px;
  color:var(--navy);
}

.full{
  grid-column:1/-1;
}

.item{
  padding:17px 0;
  border-bottom:1px solid var(--border);
}

.item:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.item:first-child{
  padding-top:0;
}

.badge{
  display:inline-block;
  padding:4px 9px;
  border-radius:20px;
  background:#e9f1f4;
  color:var(--blue);
  font-size:12px;
  font-weight:700;
}

.option{
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
  margin-top:15px;
}

.option.selected{
  border:2px solid var(--green);
  background:#f5fbf8;
}

.option img,
.cover{
  width:100%;
  max-height:330px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:16px;
}

.select-btn{
  margin-top:14px;
  border:0;
  border-radius:8px;
  padding:10px 15px;
  background:var(--blue);
  color:white;
  font-weight:700;
}

.selected-label{
  display:inline-block;
  margin-top:14px;
  color:var(--green);
  font-weight:700;
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.money{
  font-weight:700;
  font-size:20px;
  color:var(--navy);
}

.empty{
  background:white;
  border:1px dashed #ccd6da;
  border-radius:12px;
  padding:28px;
  text-align:center;
  color:var(--muted);
}

.trip-list{
  display:grid;
  gap:14px;
}

.trip-choice{
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.trip-choice.current{
  border:2px solid var(--blue);
}

.trip-choice h3{
  margin:0 0 5px;
  color:var(--navy);
}

.trip-choice-meta{
  color:var(--muted);
  font-size:14px;
}

.trip-choice button{
  flex:0 0 auto;
}

.line-list{
  white-space:pre-line;
}

a{
  color:var(--blue);
}

@media(max-width:850px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .two-col{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .header-inner{
    align-items:flex-start;
  }

  .hero h1{
    font-size:27px;
  }

  .login-card{
    padding:28px 22px;
  }
}

/* Keep fare-card heading/price area fully inside its colored section */
.pp-fare-body{
  background:#fff !important;
}
.pp-fare-body::before{
  content:"";
  display:block;
  position:absolute;
  inset:0 0 auto 0;
  height:235px;
  z-index:0;
}
.pp-fare-body{
  position:relative;
}
.pp-fare-body > *{
  position:relative;
  z-index:1;
}
.pp-fare:nth-child(1) .pp-fare-body::before{
  background:#f1eee7;
}
.pp-fare:nth-child(2) .pp-fare-body::before{
  background:#f7ead0;
}
.pp-fare:nth-child(3) .pp-fare-body::before{
  background:#1f456f;
}
.pp-fare:nth-child(3) .pp-fare-body>.pp-eyebrow,
.pp-fare:nth-child(3) .pp-fare-body>h3,
.pp-fare:nth-child(3) .pp-fare-body>.pp-muted,
.pp-fare:nth-child(3) .pp-fare-body>.pp-price,
.pp-fare:nth-child(3) .pp-fare-body>.pp-small{
  color:#fff;
}

<body>

<script>
let portalData = null;
let loginEmail = "";
let loginPassword = "";


function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function money(value) {
  return Number(value || 0)
    .toLocaleString(
      "en-US",
      {
        style:"currency",
        currency:"USD"
      }
    );
}


function prettyDate(value) {
  if (!value) return "—";

  const date =
    new Date(
      String(value).length <= 10
        ? value + "T12:00:00"
        : value
    );

  if (Number.isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleDateString(
    "en-US",
    {
      month:"short",
      day:"numeric",
      year:"numeric"
    }
  );
}


function displayName(client) {
  if (!client) return "";

  return (
    client.preferred_name ||
    client.first_name ||
    ""
  );
}


async function api(url, options = {}) {
  const response =
    await fetch(
      url,
      {
        ...options,
        credentials:"same-origin"
      }
    );

  const data =
    await response.json();

  if (!response.ok) {
    throw new Error(
      data.error ||
      "Something went wrong."
    );
  }

  return data;
}


function showLogin() {
  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("portalPage")
    .classList.add("hidden");
}


function showPortal() {
  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("portalPage")
    .classList.remove("hidden");
}


function loginError(message) {
  const box =
    document.getElementById(
      "loginMessage"
    );

  box.textContent = message;
  box.classList.remove("hidden");
}


function clearLoginError() {
  document
    .getElementById("loginMessage")
    .classList.add("hidden");
}


async function checkSession() {
  try {
    const result =
      await api("/api/portal-auth");

    if (!result.authenticated) {
      showLogin();
      return;
    }

    await loadPortal();

  } catch (error) {
    showLogin();
  }
}


document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();
      clearLoginError();

      loginEmail =
        document
          .getElementById("email")
          .value
          .trim();

      loginPassword =
        document
          .getElementById("password")
          .value
          .trim();

      try {
        const result =
          await api(
            "/api/portal-auth",
            {
              method:"POST",
              headers:{
                "Content-Type":
                  "application/json"
              },
              body:JSON.stringify({
                action:"login",
                email:loginEmail,
                password:loginPassword
              })
            }
          );

        if (result.chooseTrip) {
          const trips = result.trips || [];
          if (!trips.length) {
            loginError("No trips are currently available.");
            return;
          }

          const firstTripId = Number(trips[0].tripId);

          await api(
            "/api/portal-auth",
            {
              method:"POST",
              headers:{
                "Content-Type":
                  "application/json"
              },
              body:JSON.stringify({
                action:"login",
                email:loginEmail,
                password:loginPassword,
                tripId:firstTripId
              })
            }
          );
        }

        await loadPortal();

      } catch (error) {
        loginError(error.message);
      }
    }
  );


async function renderMyTrips() {
  const container = document.getElementById("myTripsContent");
  if (!container) return;

  try {
    const auth = await api("/api/portal-auth");
    const trips = auth.trips || [];
    const currentTripId = Number(auth.session?.tripId || portalData?.trip?.id || 0);

    if (!trips.length) {
      container.innerHTML = `<div class="empty">No trips are currently available.</div>`;
      return;
    }

    container.innerHTML = `
      <div class="trip-list">
        ${trips.map(trip => {
          const isCurrent = Number(trip.tripId) === currentTripId;
          const dates = trip.startDate
            ? `${prettyDate(trip.startDate)}${trip.endDate ? ` – ${prettyDate(trip.endDate)}` : ""}`
            : "";
          return `
            <div class="trip-choice ${isCurrent ? "current" : ""}">
              <div>
                <h3>${escapeHtml(trip.tripName || "My Trip")}</h3>
                <div class="trip-choice-meta">
                  ${trip.destination ? escapeHtml(trip.destination) : ""}
                  ${trip.destination && dates ? " • " : ""}
                  ${dates}
                </div>
              </div>
              ${
                isCurrent
                  ? `<span class="badge">Currently Viewing</span>`
                  : `<button class="primary switch-trip" type="button" data-trip-id="${Number(trip.tripId)}">View Trip</button>`
              }
            </div>
          `;
        }).join("")}
      </div>
    `;

    container.querySelectorAll(".switch-trip").forEach(button => {
      button.addEventListener("click", async () => {
        button.disabled = true;
        try {
          await api("/api/portal-auth", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
              action:"switchTrip",
              tripId:Number(button.dataset.tripId)
            })
          });

          await loadPortal();

          document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
          document.querySelectorAll(".panel").forEach(panel => panel.classList.remove("active"));

          const overviewButton = document.querySelector('[data-panel="overviewPanel"]');
          const overviewPanel = document.getElementById("overviewPanel");
          if (overviewButton) overviewButton.classList.add("active");
          if (overviewPanel) overviewPanel.classList.add("active");
        } catch (error) {
          container.innerHTML = `<div class="message">${escapeHtml(error.message)}</div>`;
        }
      });
    });
  } catch (error) {
    container.innerHTML = `<div class="message">${escapeHtml(error.message)}</div>`;
  }
}


async function loadPortal() {
  portalData =
    await api("/api/portal");

  renderPortal();
  await renderMyTrips();
  showPortal();
}


function renderPortal() {
  const {
    client,
    trip
  } = portalData;

  document
    .getElementById("welcome")
    .textContent =
      displayName(client)
        ? `Welcome, ${displayName(client)}`
        : "Welcome";

  document
    .getElementById("tripName")
    .textContent =
      trip.trip_name ||
      "My Trip";

  const meta = [];

  if (trip.destination) {
    meta.push(
      escapeHtml(trip.destination)
    );
  }

  if (trip.start_date) {
    let dates =
      prettyDate(trip.start_date);

    if (trip.end_date) {
      dates +=
        ` – ${prettyDate(
          trip.end_date
        )}`;
    }

    meta.push(dates);
  }

  document
    .getElementById("tripMeta")
    .innerHTML =
      meta
        .map(
          item =>
            `<span>${item}</span>`
        )
        .join("");

  renderOverview();
  renderProposals();
  renderItineraries();
  renderInvoices();
  renderForms();
  renderDocuments();
  renderChecklist();
}


function renderOverview() {
  const d = portalData;
  const trip = d.trip || {};
  const invoices = d.invoices || [];
  const travelers = d.travelers || [];
  const bookings = d.bookings || [];
  const itineraries = d.itineraries || [];

  const financialSummary = d.financialSummary || {};

  const tripTotal = Number(
    financialSummary.tripTotal ??
    invoices.reduce(
      (sum, invoice) => sum + Number(invoice.subtotal || 0),
      0
    )
  );

  const totalPaid = Number(
    financialSummary.totalPaid ??
    invoices.reduce(
      (sum, invoice) => sum + Number(invoice.amount_paid || 0),
      0
    )
  );

  const balanceDue = Number(
    financialSummary.balanceDue ??
    Math.max(0, tripTotal - totalPaid)
  );

  const travelerNames = travelers
    .map(traveler =>
      [
        traveler.first_name,
        traveler.middle_name,
        traveler.last_name
      ]
        .filter(Boolean)
        .join(" ")
    )
    .filter(Boolean);

  const itineraryStops = [];

  itineraries.forEach(itinerary => {
    (itinerary.items || []).forEach(item => {
      const stop = String(
        item.location || item.title || ""
      ).trim();

      if (
        stop &&
        !itineraryStops.some(
          existing =>
            existing.toLowerCase() === stop.toLowerCase()
        )
      ) {
        itineraryStops.push(stop);
      }
    });
  });

  const tripType = String(trip.trip_type || "").toLowerCase();
  const isCruise = tripType.includes("cruise");
  const isCustom =
    tripType.includes("custom") ||
    tripType.includes("itinerary");

  const detailLabel = isCruise
    ? "Ports"
    : isCustom
      ? "Stops"
      : "Trip Details";

  const bookingDetails = bookings
    .map(booking => {
      const dates = booking.start_date
        ? `${prettyDate(booking.start_date)}${
            booking.end_date
              ? ` – ${prettyDate(booking.end_date)}`
              : ""
          }`
        : "";

      return `
        <div class="item" style="padding:10px 0;">
          <strong>${escapeHtml(
            booking.booking_type || "Booking"
          )}</strong>
          ${
            booking.supplier
              ? `<span class="muted"> • ${escapeHtml(booking.supplier)}</span>`
              : ""
          }
          ${dates ? `<div class="muted">${dates}</div>` : ""}
          ${
            booking.booking_number || booking.confirmation_number
              ? `<div class="muted">Confirmation: ${escapeHtml(
                  booking.booking_number || booking.confirmation_number
                )}</div>`
              : ""
          }
        </div>
      `;
    })
    .join("");

  const tripNotes = [];

  if (trip.important_information) {
    tripNotes.push(`
      <div class="item" style="padding:10px 0;">
        ${escapeHtml(trip.important_information)}
      </div>
    `);
  }

  bookings.forEach(booking => {
    if (booking.client_notes) {
      tripNotes.push(`
        <div class="item" style="padding:10px 0;">
          <strong>${escapeHtml(
            booking.booking_type || booking.supplier || "Booking"
          )}</strong>
          <div style="margin-top:4px;">
            ${escapeHtml(booking.client_notes)}
          </div>
        </div>
      `);
    }
  });

  document.getElementById("overviewContent").innerHTML = `
    <div class="card full" style="padding:18px 20px;">
      <div style="display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap;">
        <div>
          <div class="muted" style="font-size:12px;font-weight:700;text-transform:uppercase;">Trip</div>
          <h2 style="margin:3px 0 5px;font-size:22px;">
            ${escapeHtml(trip.trip_name || trip.destination || "Your Trip")}
          </h2>
          <div>
            ${prettyDate(trip.start_date)}${
              trip.end_date ? ` – ${prettyDate(trip.end_date)}` : ""
            }
          </div>
          ${
            trip.destination
              ? `<div class="muted" style="margin-top:3px;">${escapeHtml(trip.destination)}</div>`
              : ""
          }
        </div>

        <div style="display:flex;gap:24px;flex-wrap:wrap;">
          <div>
            <div class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;">Trip Total</div>
            <div class="money" style="font-size:19px;margin-top:2px;">${money(tripTotal)}</div>
          </div>
          <div>
            <div class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;">Paid</div>
            <div class="money" style="font-size:19px;margin-top:2px;">${money(totalPaid)}</div>
          </div>
          <div>
            <div class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;">Balance Due</div>
            <div class="money" style="font-size:19px;margin-top:2px;">${money(balanceDue)}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card full" style="padding:16px 20px;">
      <h2 style="margin-bottom:8px;">Travelers</h2>
      <div>
        <strong>${travelers.length} Traveler${travelers.length === 1 ? "" : "s"}</strong>
        ${
          travelerNames.length
            ? ` <span class="muted">• ${travelerNames.map(escapeHtml).join(" • ")}</span>`
            : ""
        }
      </div>
    </div>

    <div class="card full" style="padding:16px 20px;">
      <h2 style="margin-bottom:8px;">Trip Details</h2>
      ${
        (isCruise || isCustom) && itineraryStops.length
          ? `
            <div style="margin-bottom:${bookingDetails ? "12px" : "0"};">
              <strong>${detailLabel}:</strong>
              <span>${itineraryStops.map(escapeHtml).join(" • ")}</span>
            </div>
          `
          : ""
      }
      ${
        bookingDetails ||
        `<div class="muted">Additional trip details will appear here as they are confirmed.</div>`
      }
    </div>

    ${
      tripNotes.length
        ? `
          <div class="card full" style="padding:16px 20px;">
            <h2 style="margin-bottom:8px;">Important Trip Notes</h2>
            ${tripNotes.join("")}
          </div>
        `
        : ""
    }
  `;
}


function renderChecklist() {
  const trip = portalData.trip || {};
  const forms = portalData.forms || [];
  const customChecklist = portalData.checklist || [];
  const box = document.getElementById("checklistContent");

  const completeStatuses = ["completed", "received", "signed", "complete"];

  const completedForm = phrase => forms.some(row => {
    const status = String(row.status || "").toLowerCase();
    const type = String(row.form_type || "").toLowerCase();
    const name = String(row.form_name || "").toLowerCase();
    return completeStatuses.includes(status) && (type.includes(phrase) || name.includes(phrase));
  });

  const total = Number(trip.total_cost || 0);
  const paid = Number(trip.amount_paid || 0);
  const paidInFull = total > 0 && paid >= total;
  const tripDates = trip.start_date ? `${prettyDate(trip.start_date)}${trip.end_date ? ` – ${prettyDate(trip.end_date)}` : ""}` : "Not set";

  const automaticItems = [
    { title: "Trip Dates", detail: tripDates, status: "INFO" },

function printSingleChecklist(category) {

  heading.textContent = document.querySelector(`details summary button[onclick*="${category}"]`)?.parentElement?.textContent?.replace(/Print\s*$/, "").trim() || category.replace(/_/g," ");
  const escapePrint = value => String(value ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const note = (category.startsWith("pack_") || category === "packing") ? '<p><strong>Suggested Packing List:</strong> This checklist is provided as a helpful packing guide. Items are suggestions and may not be necessary for every traveler. Please adjust your packing list based on your destination, travel dates, planned activities, and personal needs.</p>' : '';

function normalizePortalProposal(proposal) {
  const raw = String(proposal?.notes || "");
  const prefix = "__PPTD_PROPOSAL_V2__";
  if (!raw.startsWith(prefix)) return proposal;
  try {
    const details = JSON.parse(raw.slice(prefix.length));
    return {
      ...proposal,
      subtitle: details.subtitle || "",
      travel_start_date: details.travelStartDate || null,
      travel_end_date: details.travelEndDate || null,
      introduction: details.introduction || "",
      proposal_type: details.proposalType || "single",
      journey_mode: details.journeyMode || "glimpse",
      journey: details.journey || "",
      highlights: details.highlights || "",
      highlight_photos: Array.isArray(details.highlightPhotos) ? details.highlightPhotos : [],
      trip_details: details.tripDetails || "",
      notes: details.notes || ""
    };
  } catch (_) {
    return proposal;
  }
}

function proposalLines(text) {
  return String(text || "")
    .split(/\n+/)
    .map(line => line.trim())
    .filter(Boolean);
}

function proposalList(text) {
  const items = proposalLines(text);
  return items.length
    ? `<ul class="proposal-list">${items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`
    : "";
}

function proposalDates(proposal) {
  const start = proposal.travel_start_date ? prettyDate(proposal.travel_start_date) : "";
  const end = proposal.travel_end_date ? prettyDate(proposal.travel_end_date) : "";
  return start && end ? `${start} – ${end}` : start || end;
}

function proposalOptionData(option) {
  const raw = String(option?.notes || "");
  if (!raw.startsWith("__PPTD_OPTION_V1__")) {
    return {
      notes: raw,
      travelStartDate: option?.travel_start_date || option?.travelStartDate || "",
      travelEndDate: option?.travel_end_date || option?.travelEndDate || ""
    };
  }
  try {
    const details = JSON.parse(raw.slice("__PPTD_OPTION_V1__".length));
    return {
      notes: details.notes || "",
      travelStartDate: option?.travel_start_date || option?.travelStartDate || details.travelStartDate || "",
      travelEndDate: option?.travel_end_date || option?.travelEndDate || details.travelEndDate || ""
    };
  } catch (_) {
    return {
      notes: "",
      travelStartDate: option?.travel_start_date || option?.travelStartDate || "",
      travelEndDate: option?.travel_end_date || option?.travelEndDate || ""
    };
  }
}

function proposalOptionDates(option) {
  const details = proposalOptionData(option);
  const start = details.travelStartDate ? prettyDate(details.travelStartDate) : "";
  const end = details.travelEndDate ? prettyDate(details.travelEndDate) : "";
  return start && end ? `${start} – ${end}` : start || end;
}

function proposalOptionVisibleNotes(option) {
  return proposalOptionData(option).notes || "";
}

function portalHighlightCards(items = []) { const valid=(Array.isArray(items)?items:[]).filter(x=>x&&(x.imageUrl||x.image_url||x.title||x.description)).slice(0,6); if(!valid.length)return ""; return `<div class="pp-highlight-grid">${valid.map(x=>`<article class="pp-highlight-card">${x.imageUrl||x.image_url?`<img src="${escapeHtml(x.imageUrl||x.image_url)}" alt="">`:""}<div class="pp-highlight-copy">${x.title?`<h3>${escapeHtml(x.title)}</h3>`:""}${x.description?`<p>${escapeHtml(x.description)}</p>`:""}</div></article>`).join("")}</div>`; }

function renderItineraries() {
  const box = document.getElementById("itineraryContent");
  const itineraries = portalData.itineraries || [];
  if (!itineraries.length) { box.innerHTML = '<div class="empty">Your itinerary is not available yet.</div>'; return; }
  const safe = value => escapeHtml(String(value ?? ""));
  const fmt = date => date ? prettyDate(date) : "";
  box.innerHTML = itineraries.map((itinerary, itineraryIndex) => {
    const items = (itinerary.items || []).filter(item => Number(item.client_visible ?? 1) !== 0)
      .sort((a,b) => String(a.item_date||"").localeCompare(String(b.item_date||"")) || String(a.item_time||"").localeCompare(String(b.item_time||"")) || Number(a.sort_order||0)-Number(b.sort_order||0));
    const groups = [];
    for (const item of items) {
      const date = item.item_date || "Undated";
      let group = groups.find(g => g.date === date);
      if (!group) { group = {date, items:[]}; groups.push(group); }
      group.items.push(item);
    }
    const id = `pp-itinerary-${itineraryIndex}`;
    const trip = portalData.trip || {};
    const travelDates = [trip.start_date && fmt(trip.start_date), trip.end_date && fmt(trip.end_date)].filter(Boolean).join(" – ");
    const nav = groups.map((g,i) => `<a href="#${id}-day-${i}">${g.date === 'Undated' ? 'Trip Highlights' : fmt(g.date)} • ${safe(g.items[0].location || g.items[0].title || 'Activities')}</a>`).join('');
    const days = groups.map((g,i) => `<section class="pp-guide-card" id="${id}-day-${i}">
      <div class="pp-guide-date">${g.date === 'Undated' ? 'TRIP HIGHLIGHTS' : safe(fmt(g.date))}</div>
      <h3>${safe(g.items.find(x=>x.location)?.location || g.items[0]?.title || 'Your Day')}</h3>
      ${g.items.map(item => `<article class="pp-guide-item">
        <div class="pp-guide-tag">${safe(item.item_type || 'Activity')}</div>
        ${item.item_time ? `<div class="pp-guide-time">${safe(item.item_time)}</div>` : ''}
        <h4>${safe(item.title)}</h4>
        ${item.location ? `<div class="pp-guide-location">${safe(item.location)}</div>` : ''}
        ${item.details ? `<div class="pp-guide-detail">${safe(item.details)}</div>` : ''}
        ${item.image_url ? `<img loading="lazy" src="${safe(item.image_url)}" alt="${safe(item.title)}">` : ''}
        ${item.confirmation_number ? `<p class="pp-guide-item-meta">Confirmation: ${safe(item.confirmation_number)}</p>` : ''}
      </article>`).join('')}

    </section>`).join('');

      <header class="pp-guide-hero" ${itinerary.cover_image ? `style="background-image:url('${safe(itinerary.cover_image).replace(/'/g,'%27')}')"` : ''}><div>
        <h2>${safe(itinerary.title || trip.trip_name || 'Your Itinerary')}</h2>

      </div></header>
      <div class="pp-guide-layout"><aside class="pp-guide-nav"><strong>Your Itinerary</strong><nav><a href="#${id}-overview">Trip Overview</a>${nav}</nav></aside>
      <main style="min-width:0"><div class="pp-guide-actions"><button type="button" class="secondary" onclick="window.print()">Print / Save PDF</button></div>
      <section class="pp-guide-card" id="${id}-overview"><div class="pp-guide-tag">Trip Overview</div><h3>${safe(itinerary.title || 'Your Vacation')}</h3>
      ${itinerary.introduction ? `<p class="pp-guide-intro">${safe(itinerary.introduction)}</p>` : ''}
      ${travelDates ? `<p><strong>Travel dates:</strong> ${safe(travelDates)}</p>` : ''}
      ${trip.destination ? `<p><strong>Destination:</strong> ${safe(trip.destination)}</p>` : ''}

function clientPaymentScheduleRowStyle(payment) {
  const scheduled = Number(payment.amount || 0);
  const amountPaid = Number(payment.amount_paid || 0);
  const status = String(payment.status || "").trim().toLowerCase();

  if (status === "paid" || (scheduled > 0 && amountPaid >= scheduled)) {
    return "background:#e9f6ed;";
  }

  if (status === "partial" || (amountPaid > 0 && amountPaid < scheduled)) {
    return "background:#fff3cd;";
  }

  if (payment.due_date) {
    const today = new Date();
    today.setHours(0,0,0,0);

    const due = new Date(String(payment.due_date).slice(0,10) + "T00:00:00");

    if (!Number.isNaN(due.getTime())) {
      if (due < today) {
        return "background:#fde2e2;";
      }

      const daysUntilDue = Math.ceil((due - today) / 86400000);

      if (daysUntilDue <= 5) {
        return "background:#ffe0b2;";
      }
    }
  }

  return "";
}

function renderInvoices() {
  const box = document.getElementById("invoiceContent");
  const invoices = portalData.invoices || [];
  const payments = portalData.payments || [];

  if (!invoices.length) {
    box.innerHTML = `<div class="empty">No invoice is currently available.</div>`;
    return;
  }

  const badge = payment => {
    const status = String(payment.status || "Due").toLowerCase();
    const paid = status === "paid";
    const partial = status === "partial";
    const label = paid ? "PAID" : partial ? "PARTIAL" : "UNPAID";
    if (paid) return `<span style="display:inline-block;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:800;background:#dff3ea;color:#16724a;">${label}</span>`;
    return `<span style="font-size:12px;font-weight:800;">${label}</span>`;
  };

  box.innerHTML = invoices.map(invoice => {
    const allPayments = payments.filter(p => Number(p.invoice_id) === Number(invoice.id));
    const scheduled = allPayments.filter(p => Number(p.is_schedule ?? 0) === 1);
    const direct = allPayments.filter(p => Number(p.is_schedule ?? 0) !== 1 && Number(p.amount_paid || p.amount || 0) > 0.005);
    const paid = Number(invoice.amount_paid || 0);
    const balance = Number(invoice.balance_due ?? Math.max(0, Number(invoice.subtotal || 0) - paid));

    const lineItems = (invoice.items || []).length ? `<div style="margin-top:12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px 0;">${invoice.items.map(item => {
      const description = item.description || item.item_name || item.name || item.title || "Invoice Item";
      const amount = Number(item.amount ?? item.total ?? item.line_total ?? 0);
      return `<div style="display:flex;justify-content:space-between;gap:18px;padding:6px 0;"><span>${escapeHtml(description)}</span><strong style="white-space:nowrap;">${money(amount)}</strong></div>`;
    }).join("")}</div>` : "";

    const directRows = direct.length ? `<div style="margin-top:18px;"><h3 style="margin-bottom:8px;">Payments Recorded</h3><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;min-width:600px;"><thead><tr style="border-bottom:2px solid var(--border);text-align:left;"><th style="padding:9px 7px;">PAID DATE</th><th style="padding:9px 7px;">AMOUNT</th><th style="padding:9px 7px;">REFERENCE</th><th style="padding:9px 7px;">CONFIRMATION #</th><th style="padding:9px 7px;">NOTES</th></tr></thead><tbody>${direct.map(payment => `<tr style="border-bottom:1px solid var(--border);"><td style="padding:11px 7px;">${payment.paid_date ? prettyDate(payment.paid_date) : "—"}</td><td style="padding:11px 7px;">${money(Number(payment.amount_paid || payment.amount || 0))}</td><td style="padding:11px 7px;">${escapeHtml(payment.payment_reference || "—")}</td><td style="padding:11px 7px;">${escapeHtml(payment.confirmation_number || "—")}</td><td style="padding:11px 7px;">${escapeHtml(payment.notes || "—")}</td></tr>`).join("")}</tbody></table></div></div>` : "";

    const scheduleRows = scheduled.length ? `<div style="margin-top:18px;"><h3 style="margin-bottom:8px;">Payment Schedule</h3><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;min-width:720px;"><thead><tr style="border-bottom:2px solid var(--border);text-align:left;"><th style="padding:9px 7px;">STATUS</th><th style="padding:9px 7px;">DUE DATE</th><th style="padding:9px 7px;">SCHEDULED</th><th style="padding:9px 7px;">PAYMENT</th><th style="padding:9px 7px;">REMAINING</th><th style="padding:9px 7px;">PAID DATE</th></tr></thead><tbody>${scheduled.map(payment => {
      const amountPaid = Number(payment.amount_paid || 0);
      const remaining = Math.max(0, Number(payment.amount || 0) - amountPaid);
      return `<tr style="border-bottom:1px solid var(--border);${clientPaymentScheduleRowStyle(payment)}"><td style="padding:11px 7px;">${badge(payment)}</td><td style="padding:11px 7px;">${prettyDate(payment.due_date)}</td><td style="padding:11px 7px;">${money(payment.amount)}</td><td style="padding:11px 7px;">${money(amountPaid)}</td><td style="padding:11px 7px;">${money(remaining)}</td><td style="padding:11px 7px;">${payment.paid_date ? prettyDate(payment.paid_date) : "—"}</td></tr>`;
    }).join("")}</tbody></table></div></div>` : `<div class="muted" style="margin-top:16px;">No payment schedule created for this invoice.</div>`;

    return `<div class="card" style="margin-bottom:20px;">
      <h2 style="margin-bottom:4px;">${escapeHtml(invoice.title || "Trip Invoice")}</h2>
      <div class="muted">${escapeHtml(invoice.invoice_number || "")}${invoice.due_date ? ` • Due ${prettyDate(invoice.due_date)}` : ""}</div>
      ${lineItems}
      <div style="font-size:18px;font-weight:700;margin:14px 0 16px;line-height:1.5;"><strong>Invoice Total:</strong> ${money(invoice.subtotal)} &nbsp;&nbsp;&nbsp; <strong>Paid:</strong> ${money(paid)} &nbsp;&nbsp;&nbsp; <strong>Balance:</strong> ${money(balance)}</div>
      ${directRows}
      ${scheduleRows}
      ${invoice.notes ? `<p style="margin-top:18px;">${escapeHtml(invoice.notes)}</p>` : ""}
      ${balance > 0.005 ? `<div style="margin-top:20px;"><button type="button" onclick="requestInvoicePayment(${Number(invoice.id)}, ${balance})">Request to Make a Payment</button></div>` : ""}
    </div>`;
  }).join("");
}

async function requestInvoicePayment(invoiceId, balance) {
  const entered = window.prompt(`Enter the amount you would like to request to pay (up to ${money(balance)}):`, Number(balance).toFixed(2));
  if (entered === null) return;
  const amount = Number(String(entered).replace(/[$,]/g, ""));
  if (!Number.isFinite(amount) || amount <= 0) return alert("Enter a valid payment amount.");
  if (amount > Number(balance) + 0.005) return alert(`The request cannot be more than the current balance of ${money(balance)}.`);
  try {
    const response = await fetch("/api/portal", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"requestPayment",invoiceId,amount})});
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.error || "Unable to send payment request.");
    alert("Your payment request has been sent to your travel advisor.");
  } catch (error) { alert(error.message); }
}
